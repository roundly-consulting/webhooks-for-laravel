name: phpstan

on:
  workflow_dispatch:

# safe-fetch-for-laravel is not on Packagist yet: cloned from its private repo with the repository
# secret PRIVATE_REPOS_TOKEN. Goes when safe-fetch publishes.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.PRIVATE_REPOS_TOKEN }}"}}'

jobs:
  phpstan:
    name: phpstan (P${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5, 8.6]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer analyse
